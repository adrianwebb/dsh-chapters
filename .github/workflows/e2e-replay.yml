name: acceptance (tape replay)
on:
  push: {}
  pull_request: {}
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # THE Prerequisite the runner image must satisfy: the pinned DSH host on
      # PATH (npm registry location is deployment-specific — TODO for whoever
      # wires hosted CI; scripts/ci-replay.sh fails loudly with exit 2 if absent)
      # - run: npm i -g @deepseek-ai/dsh@0.1.5-rc.1   # adjust to your registry
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64
      - run: bash scripts/ci-replay.sh
