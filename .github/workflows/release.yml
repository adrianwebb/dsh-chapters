name: Release

# Publishes the plugin package `@treeseed/dsh-chapters` to npm
# (npm scope 'treeseed'; GitHub org 'treeseed-ai' — deliberately different homes).
#
# Auth: npm TRUSTED PUBLISHING (OIDC) — there is NO NPM_TOKEN in CI. The npm
# package's Trusted Publisher is registered on npmjs.com for exactly:
#   Repository:  treeseed-ai/dsh-chapters
#   Branch:      main
#   Workflow:    release.yml
#   Environment: Production
# npm's CLI detects the Actions OIDC environment itself and asks the registry
# for a one-time signed token — setup-node must therefore get `registry-url`
# but NEVER a `token:` input (any _authToken in an npmrc overrides this path).
#
# Two ways in:
#   1. push a version tag:  git tag 0.1.1 && git push origin 0.1.1
#      (bare semver — the 'Production' environment's tag protection is *.*.*)
#   2. Actions tab → "Run workflow" (manual dispatch; dry_run to rehearse)
# The gate is the FULL deterministic suite (incl. the 85/85/85 coverage gate);
# we do not publish on a red suite. The tape-replay acceptance chain runs in
# ci.yml on every push to main; here we re-run the deterministic plane.
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the actual publish'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: build · test · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 'Production' enforces tag protection *.*.* — a non-semver tag never
    # reaches this job. (No secrets needed anymore: OIDC identity IS the auth.)
    environment: Production
    permissions:
      contents: read
      id-token: write # REQUIRED: mints the OIDC token npm trades for a
                      # one-time publish credential AND signs provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: deterministic suite + coverage gate (publish blocker)
        run: npm run coverage:ci

      # The tag IS the version: 0.1.1 ↔ "version": "0.1.1".
      - name: version / tag consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "$(node -p "require('./package.json').version")" ]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json version $(node -p "require('./package.json').version") — bump before tagging"
            exit 1
          fi

      # What would ship (sanity: lib/, presets/, cordis.patch.yml, docs, README).
      - name: pack preview
        run: npm pack --dry-run 2>&1 | tail -30

      - name: publish (npm trusted publishing / OIDC)
        if: ${{ !inputs.dry_run }}
        run: |
          # Prerelease versions ('x.y.z-tag') ship under a matching dist-tag so
          # they never steal 'latest' from the last stable ship.
          V="$(node -p "require('./package.json').version")"
          case "$V" in
            *-*) npm publish --provenance --tag "${V#*-}" ;;
            *)   npm publish --provenance ;;
          esac

      - name: shipped
        if: ${{ !inputs.dry_run }}
        run: echo "@treeseed/dsh-chapters@$(node -p "require('./package.json').version") is on npm (provenance attached) — https://www.npmjs.com/package/@treeseed/dsh-chapters"
