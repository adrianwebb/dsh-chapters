name: Release

# Publishes the plugin package `dsh-chapters` to npm. Two ways in:
#   1. push a version tag:  git tag 0.1.0 && git push origin 0.1.0
#      (bare semver — the 'Production' environment's tag protection is *.*.*)
#   2. Actions tab → "Run workflow" (manual dispatch; dry-run toggle to rehearse)
# The gate is the FULL deterministic suite (incl. the 85/85/85 coverage gate);
# we do not publish on a red suite. The acceptance (tape-replay) chain runs in
# ci.yml on every push to main; here we re-run the deterministic plane.
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the actual publish'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: build · test · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 'Production' carries the NPM_TOKEN secret and enforces tag protection
    # *.*.* — a non-semver tag never reaches this job.
    environment: Production
    # id-token: write enables npm provenance attestations alongside the token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: deterministic suite + coverage gate (publish blocker)
        run: npm run coverage:ci

      # The tag IS the version: 0.1.0 ↔ "version": "0.1.0".
      - name: version / tag consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "$(node -p "require('./package.json').version")" ]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json version $(node -p "require('./package.json').version") — bump before tagging"
            exit 1
          fi

      # What would ship (sanity: lib/, presets/, cordis.patch.yml, docs, README).
      - name: pack preview
        run: npm pack --dry-run 2>&1 | tail -30

      - name: publish
        if: ${{ !inputs.dry_run }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: shipped
        if: ${{ !inputs.dry_run }}
        run: echo "dsh-chapters@$(node -p "require('./package.json').version") is on npm — https://www.npmjs.com/package/dsh-chapters"
