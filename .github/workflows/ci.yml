name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Never two GPU-free but browser-heavy e2e chains fighting for the same
# throwaway homes/ports across concurrent pushes of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── deterministic plane: unit + integration ─────────────────────────
  test:
    name: typecheck · build · unit + integration (coverage gate 85/85/85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # All dependencies (incl. every @deepseek-ai/* devDep) resolve from the
      # PUBLIC registry — no install secret and no private-registry config.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The gate IS the contract: c8 --check-coverage fails the job below
      # 85% on statements, branches, functions (and lines). Current ledger:
      # 97.98 / 85.61 / 93.62. Reports land in var/coverage for the artifact.
      - name: unit + integration with coverage gate
        run: npm run coverage:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-deterministic
          path: var/coverage/
      # treedx-live.test.ts skips itself when TreeDX is not configured (the
      # service source is a private clone); configured-but-unreachable FAILS.
      # The TreeDX transport is still proven in CI against the in-process
      # stub: treedx-{provider,sync,link,provider-branches}.test.ts.
      - name: test summary
        run: |
          node -e "const s=require('./var/coverage/coverage-summary.json').total;
            console.log('| metric | covered | total | pct |');
            for (const k of ['lines','statements','branches','functions'])
              console.log('|',k,'|',s[k].covered,'|',s[k].total,'|',s[k].pct+'%|');" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────── acceptance plane: model-tape replay ─────────────────────────
  e2e-replay:
    name: acceptance — six browser projects from committed tapes (no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The e2e boots spawn the INSTALLED dsh host (same version the whole
      # acceptance ledger was measured on; scripts/ci-replay.sh verifies it).
      # pnpm too: ubuntu-latest no longer ships it and dsh's profile plugin
      # management requires it (measured: exit 127 'pnpm not found on PATH').
      - run: npm install -g @deepseek-ai/dsh@0.1.5-rc.1 pnpm
      # chromium's shared-library deps (the Playwright image lacks some).
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64
      # Self-checking chain: pins the host version, builds, bootstraps the
      # scratch home, installs chromium into var/ms-playwright, and runs
      # E2E_MODEL=replay npm run test:e2e (suite/heavy/arrival/enrich/fanout/
      # rules). Tape misses answer as loud 503s — nothing talks to a model.
      - run: bash scripts/ci-replay.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-replay-diagnostics
          path: |
            test-results/
            var/e2e-boot.json
            var/e2e-tape-misses.log
          if-no-files-found: ignore
