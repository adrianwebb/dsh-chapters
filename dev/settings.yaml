# dsh-chapters DEV profile settings — the real target environment.
# The Local Qwen model at a 32K window: the context regime this plugin exists for.
# (The live ~/.dsh settings carry the same provider at a 128K window; this dev
# profile pins 32K because that is the context regime the plugin is designed for.)
llm-pi-ai:
  providers:
    local:
      displayName: Local
      api: openai-completions
      baseURL: http://localhost:8080/v1
      models:
        - id: qwen3.8-flash-next
          name: qwen3.8-flash-next (dev, 32K)
          contextWindow: 32768
          maxTokens: 8192
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
      apiKeyEnv: LOCAL_API_KEY
      streamIdleTimeoutMs: 3600000
      timeoutMs: 3600000
      reasoning: medium
      retryPolicy:
        mode: normal
        maxRetries: 0
      compat:
        supportsDeveloperRole: false

agent-default-model:
  provider: local
  model: qwen3.8-flash-next
  reasoningEffort: medium

agent-presets:
  default: chapters
