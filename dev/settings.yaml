# dsh-chapters DEV settings — the real target: Local Qwen, 64K window.
# Copy to $DSH_HOME/settings.yaml (scripts/bootstrap-dev-profile.sh does it,
# write-if-missing; --force to overwrite).
# Provider block mirrors the live ~/.dsh/settings.yaml. The window is 64000
# (Adrian's edit, validated by session-ecf4353f: pressure fired exactly at
# 0.9 x 64000; compaction took the surface 56.7K -> 31.6K, server-reported).
# 32768 remains supported in principle but proved too small for coding/
# deep-research work — the 27-tool header (~13-15K) leaves too little room;
# 64000 sits just under the server's real n_ctx of 65536 with headroom.
llm-pi-ai:
  providers:
    local:
      displayName: Local
      api: openai-completions
      baseURL: http://localhost:8080/v1
      models:
        - id: qwen3.8-flash-next
          name: qwen3.8-flash-next
          contextWindow: 64000
          maxTokens: 16000
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
      apiKeyEnv: LOCAL_API_KEY
      streamIdleTimeoutMs: 3600000
      timeoutMs: 3600000
      reasoning: medium
      retryPolicy:
        mode: normal
        maxRetries: 0
      compat:
        supportsDeveloperRole: false

agent-default-model:
  provider: local
  model: qwen3.8-flash-next
  reasoningEffort: medium

# New sessions default to the Chapters preset — the engine (and the tools'
# fallbackPreset) must be live by DEFAULT in the dev profile, otherwise
# "auto-compaction" is something you have to remember to enable, which is
# the invisibility that made the last handoff worthless.
agent-presets:
  default: chapters

ui-onboarding:
  welcomeNoticeVersion: dev
