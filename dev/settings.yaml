# dsh-chapters DEV profile settings — the real target environment.
# The Local Qwen model at the 64K window the user actually runs (32K was tried
# and rejected as too small for real work — the 27-tool header alone is
# ~13-15K). This mirrors the live ~/.dsh Local-provider block exactly: same
# model, same window, same timeouts. The engine's pressure threshold math is
# proven here at the real regime, not a projected one.
llm-pi-ai:
  providers:
    local:
      displayName: Local
      api: openai-completions
      baseURL: http://localhost:8080/v1
      models:
        - id: qwen3.8-flash-next
          name: qwen3.8-flash-next (dev, 64K — the real regime)
          contextWindow: 64000
          maxTokens: 16000
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
      apiKeyEnv: LOCAL_API_KEY
      streamIdleTimeoutMs: 3600000
      timeoutMs: 3600000
      reasoning: medium
      retryPolicy:
        mode: normal
        maxRetries: 0
      compat:
        supportsDeveloperRole: false

agent-default-model:
  provider: local
  model: qwen3.8-flash-next
  reasoningEffort: medium

agent-presets:
  default: chapters
